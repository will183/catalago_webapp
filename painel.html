<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do lojista</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header>
    <h1>Painel do lojista</h1>
    <button id="btn-sair" hidden>Sair</button>
  </header>

  <section id="login">
    <h2>Entrar</h2>
    <form id="form-login">
      <input type="email" id="email" placeholder="E-mail" required>
      <input type="password" id="senha" placeholder="Senha" required>
      <button type="submit">Entrar</button>
    </form>
  </section>

  <section id="area-lojista" hidden>
    <form id="form-produto">
  <input id="prod-nome" placeholder="Nome do produto" required>
  <input id="prod-descricao" placeholder="Descrição">
  <input id="prod-preco" type="number" step="0.01" min="0" placeholder="Preço (ex: 25.90)" required>
  <input id="prod-categoria" placeholder="Categoria (ex: Lanches)">
  <button type="submit">Adicionar produto</button>
</form>
    <h2>Produtos</h2>
    <button id="btn-atualizar-pedidos">Atualizar pedidos</button>
    <div id="lista-produtos"></div>

    <h2>Pedidos de hoje</h2>
    <div id="lista-pedidos"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/painel.js"></script>
</body>
</html>
